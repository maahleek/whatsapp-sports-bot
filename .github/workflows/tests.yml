name: Tests

on:
  push:
    branches:
      - main
      - portfolio-hardening
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python sources
        run: |
          python -m py_compile bot.py sportybet.py betting_platforms.py rag.py run.py knowledge_base.py

      - name: Run API and model tests
        run: python test_api.py

      - name: Run SportyBet parser tests
        run: python test_sportybet.py

      - name: Run WhatsApp response formatting tests
        run: python test_response_formatting.py

      - name: Run RAG smoke tests
        run: python test_rag.py
